[project]
name = "archive-crawl"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archive_crawl", "archive_crawl.fixtures"]

[tool.setuptools.package-dir]
"archive_crawl.fixtures" = "fixtures"

[tool.setuptools.package-data]
"archive_crawl.fixtures" = ["*.json"]
